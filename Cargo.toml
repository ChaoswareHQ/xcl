[workspace]
resolver = "3"
default-members = ["crates/xcl-cli", "crates/xcl-runtime"]
members = ["crates/*", "plugins/*"]

[workspace.package]
version      = "0.1.0"
edition      = "2024"
rust-version = "1.99.0"
authors      = ["Nguyễn Quý Ngọc ngoc.nguyen@chaoswarehq.com"]
license      = "MIT OR Apache-2.0"
repository   = "https://github.com/ChaoswareHQ/xcl"
readme       = "README.md"
homepage     = "https://chaoswarehq.com"

[workspace.dependencies]
xcl-analysis = { path = "crates/xcl-analysis" }
xcl-debug = { path = "crates/xcl-debug" }
xcl-macros = { path = "crates/xcl-macros" }
xcl-std = { path = "crates/xcl-std" }
xcl-vm     = { path = "crates/xcl-vm" }

# plugins/*
xcl-bevy   = { path = "plugins/bevy" }

# plugins/bevy
bevy = "0.20"

# xcl-cli
mimalloc = "0.1.52"

# xcl-macros
proc-macro2 = { version = "1.0.107", features = ["span-locations"] }
quote = "1.0.47"
syn = { version = "3.0.9", features = ["full"] }

# xcl-vm
logos     = "0.16.1"
smallvec  = "1.16.3"
bumpalo   = "3.20.3"
hashbrown = "0.17.1"
linkme    = "0.3.37"

# [std.io]
itoa = "1.0.18"
ryu = "1.0.23"

# xcl-wasm — browser bindings for the playground
wasm-bindgen = "0.2"

# [std.encoding]
serde = "1.0.229"
serde_json = "1.0.154"

# [std.math]
glam = "0.34.1"
num-complex = "0.4.6"
rand = { version = "0.10.3", default-features = false, features = ["std", "sys_rng", "thread_rng"] }

# [std.net] — lightweight, secure HTTPS client (synchronous, TLS configured per-platform in xcl-std)
ureq = "3.4.2"

# [std.sys, std.ffi, std.abi] — platform-specific FFI
libc = "0.2"

# [std.cloud] — AWS Signature V4 signing
hmac = "0.13.0"
sha2 = "0.11.1"
hex = "0.4.3"

# [std.sys] — Windows API (used by xcl-std)
windows = { version = "0.62.2", features = [
    "Win32_System_LibraryLoader",
    "Win32_System_SystemInformation",
    "Win32_Storage_FileSystem",
] }

# Benchmarking
criterion = "0.8.2"
mlua = { version = "0.12", default-features = false, features = ["luau", "vendored"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = false
debug-assertions = false

# Size: Cranelift is compile-time machinery, not hot runtime code, so optimize
# it for size. The generated XCL code is unaffected, and JIT compile time was
# measured unchanged (~1.3 ms for `fib`; see docs/benchmarking.md).
[profile.release.package."cranelift-codegen"]
opt-level = "z"

[profile.release.package."cranelift-assembler-x64"]
opt-level = "z"

[profile.release.package."cranelift-frontend"]
opt-level = "z"

[profile.release.package."cranelift-jit"]
opt-level = "z"

[profile.release.package."cranelift-module"]
opt-level = "z"

[profile.release.package."cranelift-native"]
opt-level = "z"

[profile.release.package."regalloc2"]
opt-level = "z"

# Profiling: debug info + opt-level 1 for flamegraph readability
[profile.bench-flamegraph]
inherits = "release"
opt-level = 1
debug = true
strip = false

# Profiling: LTO release with debuginfo for BOLT re-compilation
[profile.release-lto-debug]
inherits = "release"
debug = true
strip = false
