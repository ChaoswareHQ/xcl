[package]
name = "xcl-doc"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
# Registries, values, and the VM live in the engine.
xcl-rt.workspace = true
# Parsing `.xcl` examples in the docs needs the compiler.
xcl-toolchains = { workspace = true, default-features = false, features = ["std"] }
serde = { workspace = true, features = ["derive"] }
serde_json = "1"
pulldown-cmark = "0.13"
tiny_http = "0.12"
anyhow = "1"
