[package]
name = "xcl-vm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true

[features]
default = ["std"]
std = []
opcode-stats = []
# Cranelift-backed JIT for integer loops. Off by default; requires `std`.
jit = ["std", "dep:xcl-jit"]

[dependencies]
logos.workspace = true
# `collections` provides `bumpalo::collections::String`, used to build
# concatenation results directly in the arena (one write, no intermediate
# allocation, reclaimed with the VM).
bumpalo = { workspace = true, features = ["collections"] }
smallvec.workspace = true
hashbrown.workspace = true
xcl-macros.workspace = true
xcl-jit = { path = "../xcl-jit", optional = true }

[dev-dependencies]
criterion.workspace = true
mlua.workspace = true

[[bench]]
name = "vm_core"
harness = false

[[bench]]
name = "vm_data"
harness = false

[[bench]]
name = "vm_algorithms"
harness = false

[[bench]]
name = "vm_games"
harness = false
