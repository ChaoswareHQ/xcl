[package]
name = "xcl-jit"
description = "Cranelift-backed JIT for integer loops in XCL bytecode"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

[dependencies]
# `unwind` is enabled by cranelift-jit/module/native regardless; disabling the
# defaults here only drops the `timing` instrumentation from the final binary.
cranelift-codegen = { version = "0.137", default-features = false, features = ["std", "host-arch"] }
cranelift-frontend = "0.137"
cranelift-jit = "0.137"
cranelift-module = "0.137"
cranelift-native = "0.137"
