[package]
name = "xcl-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[lib]
# `cdylib` for the browser build, `rlib` so the same functions are testable on
# the host (`wasm-bindgen` emits ordinary functions outside wasm).
crate-type = ["cdylib", "rlib"]

[dependencies]
xcl-rt = { workspace = true, default-features = false, features = ["std"] }
# Compiler, linter, and disassembler without the host half: `std::fs`, the C ABI,
# and mimalloc have no place in the browser build.
xcl-toolchains = { workspace = true, default-features = false, features = ["std", "trace"] }
wasm-bindgen.workspace = true
