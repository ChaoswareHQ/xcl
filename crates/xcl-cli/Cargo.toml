[package]
name = "xcl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[[bin]]
name = "xcl"
path = "src/main.rs"

# The launcher deliberately has no link-time dependency on the interpreter.
# It loads `xcl_rt.dll` (or the platform equivalent) at run time; see
# `src/loader.rs`. Only the dynamic loader itself is platform-specific.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

[features]
# Kept so existing build scripts (`--features lint`, `--features debug`) keep
# working. The interpreter loaded at run time always contains both. The JIT is
# compiled into the SDK, not the launcher:
# `cargo build -p xcl-toolchains --features jit`.
default = ["lint"]
lint = []
debug = []
jit = []
