[package]
name = "xcl-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[[bin]]
name = "xcl"
path = "src/main.rs"

[dependencies]
mimalloc.workspace = true
xcl-debug = { workspace = true, optional = true }
xcl-plugins.workspace = true
xcl-vm.workspace = true

[features]
default = []
# Enable the Cranelift JIT in the VM (`cargo build -p xcl-cli --features jit`).
jit = ["xcl-vm/jit"]
# Enable bytecode disassembly (`xcl -d`). Off by default so the shipping binary
# does not carry the disassembler.
debug = ["dep:xcl-debug"]
