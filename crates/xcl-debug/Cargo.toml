[package]
name = "xcl-debug"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme = "README.md"
homepage.workspace = true

[[bin]]
name = "xcl-debug"
path = "src/main.rs"

[[bin]]
name = "xcl-bytecode"
path = "src/bytecode_main.rs"

[dependencies]
xcl-rt.workspace = true
# Compiler only: the tools read their own files, so the host half is not needed.
xcl-toolchains = { workspace = true, default-features = false, features = ["std"] }
