[package]
name = "xcl-plugins"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
homepage.workspace = true

[dependencies]
xcl-macros.workspace = true
xcl-vm.workspace = true
linkme.workspace = true
hashbrown.workspace = true
glam.workspace = true
num-complex.workspace = true
rand.workspace = true

# [std.io]
itoa.workspace = true
ryu.workspace = true

# [std.encoding] — JSON serialization for MCP and general use
serde.workspace = true
serde_json.workspace = true

# [std.net] — lightweight, secure HTTPS client (platform-specific TLS in target sections below)

# [std.sys, std.ffi, std.abi] — platform-specific FFI
libc.workspace = true

# [std.cloud] — AWS Signature V4 signing
hmac.workspace = true
sha2.workspace = true
hex.workspace = true

[target.'cfg(windows)'.dependencies]
# ureq with rustls + platform verifier (uses Windows cert store, no webpki-roots)
ureq = { workspace = true, default-features = false, features = ["rustls", "platform-verifier"] }
windows.workspace = true

[target.'cfg(not(windows))'.dependencies]
# ureq with rustls + platform verifier (uses OS cert store, no webpki-roots)
ureq = { workspace = true, default-features = false, features = ["rustls", "platform-verifier"] }

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "integration"
harness = false

[[bench]]
name = "vibemark"
harness = false